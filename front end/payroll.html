<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payroll - Payroll Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <h1>Payroll Management</h1>

        <div class="employee-form">

            <h2>Calculate Payroll</h2>

            <input
                type="text"
                id="employeeId"
                placeholder="Employee ID"
            >

            <input
                type="number"
                id="basicSalary"
                placeholder="Basic Salary"
            >

            <input
                type="number"
                id="allowance"
                placeholder="Allowance"
            >

            <input
                type="number"
                id="deduction"
                placeholder="Deduction"
            >

            <button onclick="calculatePayroll()">
                Calculate Payroll
            </button>

            <p id="message"></p>

        </div>

        <div id="result"></div>

    </div>


    <script>

        function calculatePayroll() {

            const employeeId =
                document.getElementById("employeeId").value.trim();

            const basicSalary =
                Number(document.getElementById("basicSalary").value);

            const allowance =
                Number(document.getElementById("allowance").value);

            const deduction =
                Number(document.getElementById("deduction").value);


            if (
                !employeeId ||
                basicSalary <= 0 ||
                allowance < 0 ||
                deduction < 0
            ) {

                alert("Please enter valid payroll details");

                return;

            }


            const grossSalary =
                basicSalary + allowance;

            const netSalary =
                grossSalary - deduction;


            document.getElementById("result").innerHTML = `

                <h2>Payroll Summary</h2>

                <p>
                    <strong>Employee ID:</strong>
                    ${employeeId}
                </p>

                <p>
                    <strong>Basic Salary:</strong>
                    ₹${basicSalary}
                </p>

                <p>
                    <strong>Allowance:</strong>
                    ₹${allowance}
                </p>

                <p>
                    <strong>Gross Salary:</strong>
                    ₹${grossSalary}
                </p>

                <p>
                    <strong>Deduction:</strong>
                    ₹${deduction}
                </p>

                <p>
                    <strong>Net Salary:</strong>
                    ₹${netSalary}
                </p>

            `;

            document.getElementById("message").textContent =
                "Payroll calculated successfully.";

        }

    </script>

</body>

</html>
